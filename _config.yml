# guides.webdogs.com — synced verbatim into theWEBDOGS/guides by
# scripts/publish-guides.sh. Edit here (site/ in the private catalog repo),
# never in the public repo.
title: WEBDOGS Guides
tagline: Guides & Know-How from the WEBDOGS team   # homepage <title> suffix (jekyll-seo-tag)
description: Shared knowledge from the WEBDOGS team  # hero lede + meta description
url: "https://guides.webdogs.com"
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# GitHub Pages enables these two by default, and both misfire on our raw .md
# assets — the published guide twins (<slug>/<slug>.md) and the starter CLAUDE.md,
# which are meant to be served verbatim, not rendered:
#   - optional-front-matter would render each into a titleless pseudo-guide page;
#   - relative-links would rewrite a [text](file.md) link to point at that .html.
# Keep .md files static and .md links literal.
relative_links:
  enabled: false
optional_front_matter:
  enabled: false

# Every page is a guide unless its own front matter says otherwise
# (the generated index.md sets layout: home). The default image feeds
# og:image via jekyll-seo-tag for any page without its own.
defaults:
  - scope:
      path: ""
    values:
      layout: guide
      image: /assets/og-default.png

kramdown:
  auto_ids: true   # heading ids power the TOC and the guides' in-page anchors
