---
layout: base
---
<div class="band">
  <div class="band-in">
    <div class="brandrow">
      {% include logo.svg class="logo" %}
      <a class="wordmark" href="{{ '/' | relative_url }}">WEBDOGS GUIDES</a>
    </div>
    <nav class="crumb"><a href="{{ '/' | relative_url }}">← All guides</a></nav>
    <h1>{{ page.title }}</h1>
    {%- if page.time %}<p><span class="time">{{ page.time }}</span></p>{% endif %}
  </div>
</div>
<div class="layout">
  <article>
    {{ content }}
  </article>
  <aside>
    {% include toc.html html=content %}
  </aside>
</div>
<script src="{{ '/assets/js/copy-code.js' | relative_url }}"></script>
